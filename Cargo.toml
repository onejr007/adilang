[package]
name = "adilang"
version = "0.1.0"
edition = "2021"
description = "ADILang — AI-designed DSL for 3D virtual worlds (Rust → WASM → WebGL2)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "MouseEvent",
    "PointerEvent",
    "WebGl2RenderingContext",
    "Window",
] }
glow = { version = "0.18" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
